services:
  app:
    image: oan-notification-service:latest
    container_name: oan-notification-service
    environment:
      NODE_ENV: development
      PORT: "8082"
      DB_HOST: 10.230.0.3
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "1a]D[]hs9Hxy|#GV"
      DB_DATABASE: oan_notification_prod
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      PGSSLMODE: require
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: http://localhost:3001
      NOTIFICATION_RADIUS_KM: 1
      LOG_LEVEL: debug
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis/redis-stack:latest
    container_name: oan-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data: